name: Update IAM News

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:        # manual trigger

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit and push news.json
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch & validate news
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name "iam-news-bot"
          git config user.email "bot@noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update IAM news [$(date -u +%Y-%m-%dT%H:%M)]"
          git pull --rebase origin master
          git push origin master

      - name: Trigger Netlify deploy
        if: env.NETLIFY_DEPLOY_HOOK != ''
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: curl -s -X POST "$NETLIFY_DEPLOY_HOOK"
