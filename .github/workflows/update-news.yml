name: Update IAM News

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name "iam-news-bot"
          git config user.email "bot@noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "chore: update IAM news [$(date -u +%Y-%m-%dT%H:%M)]"
          git push

      - name: Trigger Netlify deploy
        if: env.NETLIFY_DEPLOY_HOOK != ''
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: curl -s -X POST "$NETLIFY_DEPLOY_HOOK"
