<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAM Pulse — Identity & Access Management News</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🔑</span>
        <div>
          <h1>IAM Pulse</h1>
          <p class="brand-sub">Identity &amp; Access Management — Daily Intelligence</p>
        </div>
      </div>
      <div class="header-meta">
        <span id="article-count" class="meta-badge">Loading…</span>
        <span id="last-updated" class="meta-badge">–</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>Filter by Topic</h3>
        <div id="tag-filters" class="filter-group"></div>
      </div>
      <div class="sidebar-section">
        <h3>Filter by Source</h3>
        <div id="category-filters" class="filter-group"></div>
      </div>
      <div class="sidebar-section">
        <button id="clear-filters" class="clear-btn">Clear all filters</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <div class="search-bar">
        <input id="search" type="search" placeholder="Search IAM news…" autocomplete="off" />
      </div>

      <div id="active-filters" class="active-filters"></div>

      <div id="news-grid" class="news-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading latest IAM intelligence…</p>
        </div>
      </div>

      <div id="no-results" class="no-results" style="display:none">
        <p>No articles match your filters. <a href="#" id="reset-link">Clear filters</a></p>
      </div>
    </main>
  </div>

  <!-- Article modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>IAM Pulse aggregates publicly available RSS feeds. Updated daily via GitHub Actions.
    <a href="https://github.com" target="_blank" rel="noopener">Source on GitHub</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
